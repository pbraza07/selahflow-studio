name: Verify live deployment
on:
  pull_request:
    paths:
      - 'scripts/verify-live-deployment.mjs'
      - '.github/workflows/verify-live-deployment.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed endpoints without customer mutations
        env:
          SMOKE_TARGETS: '[{"url":"https://selahflow-staging.onrender.com","version":"1.3.122"}]'
        run: node scripts/verify-live-deployment.mjs
