name: Verify live deployment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-live-deployment.mjs'
      - 'scripts/verify-business-assistant.mjs'
      - 'scripts/verify-assistant-status.mjs'
      - '.github/workflows/verify-live-deployment.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed endpoints without customer mutations
        env:
          SMOKE_TARGETS: '[{"url":"https://selahflow-staging.onrender.com","version":"1.3.164"},{"url":"https://selahflow.onrender.com","version":"1.3.164"}]'
        run: |
          node scripts/verify-live-deployment.mjs
          node scripts/verify-business-assistant.mjs
          node scripts/verify-assistant-status.mjs
          node scripts/verify-first-customer-commissions.mjs
